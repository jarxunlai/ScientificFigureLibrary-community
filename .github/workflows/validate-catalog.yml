name: sfl-community-catalog-policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  policy:
    name: sfl-community-catalog-policy-v1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base validators
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout untrusted catalog candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout fixed central Archives main with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jarxunlai/ScientificFigureLibrary-community-archives
          ref: main
          fetch-depth: 0
          path: archives
          persist-credentials: false
      - name: Use the trusted policy Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: trusted/package-lock.json
      - name: Install pinned trusted schema validator
        run: npm --prefix trusted ci --ignore-scripts --no-audit --no-fund
      - name: Enforce exact v2 add, withdrawal, or one-time migration tree policy
        id: policy
        shell: bash
        run: node trusted/scripts/validate-pr-trees.mjs trusted candidate --github-output "$GITHUB_OUTPUT"
      - name: Validate candidate catalog addition
        if: steps.policy.outputs.mode == 'add'
        run: node trusted/scripts/validate-repository.mjs trusted candidate archives
      - name: Validate metadata-only catalog withdrawal
        if: steps.policy.outputs.mode == 'withdraw'
        run: node trusted/scripts/validate-withdrawal.mjs trusted candidate
      - name: Validate one-time zero-entry v1-to-v2 migration
        if: steps.policy.outputs.mode == 'migration'
        run: node trusted/scripts/validate-migration.mjs trusted candidate
      - name: Validate the complete candidate snapshot
        run: node trusted/scripts/validate-full-repository.mjs candidate
      - name: Run trusted validator regression tests
        run: node --test trusted/tests/*.test.mjs
      - name: Record the exact Archives trust observation
        if: always()
        shell: bash
        run: |
          archives_head="$(git -C archives rev-parse HEAD)"
          printf '### Catalog validation trust observation\n\n- Archives main observed at `%s`\n' "$archives_head" >> "$GITHUB_STEP_SUMMARY"
